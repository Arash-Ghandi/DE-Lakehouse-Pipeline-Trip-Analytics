name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java (required by Spark)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v

      - name: Generate sample data
        run: python src/ingestion/generate_sample_data.py --rows 2000 --out data/raw

      - name: Run Bronze -> Silver -> Gold pipeline (smoke test)
        run: |
          python src/bronze/ingest_to_bronze.py
          python src/silver/clean_transform.py
          python src/gold/aggregate.py

      - name: Install & smoke-test the API
        run: |
          pip install -r api/requirements.txt
          python -c "from api.main import app; print('FastAPI app imported OK:', app.title)"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build the dashboard
        working-directory: frontend
        run: |
          npm install
          npm run build
